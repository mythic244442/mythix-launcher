[package]
name = "mythix-launcher"
version = "0.1.0"
description = "mythix — a Wine/Proton hybrid game launcher"
authors = ["mythix"]
edition = "2021"

[lib]
name = "mythix_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri              = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell   = "2"
tauri-plugin-dialog  = "2"
tauri-plugin-fs      = "2"
tauri-plugin-process = "2"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tokio              = { version = "1", features = ["full"] }
uuid               = { version = "1", features = ["v4"] }
dirs               = "5"
thiserror          = "1"
log                = "0.4"
env_logger         = "0.11"
nix                = { version = "0.29", features = ["signal", "process"] }
reqwest            = { version = "0.12", features = ["stream", "json"] }
sha2               = "0.10"
futures-util       = "0.3"
tempfile           = "3"
urlencoding        = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
